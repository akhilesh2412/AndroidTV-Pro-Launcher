plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kulwant.atvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kulwant.atvhome'
        minSdk 28
        //noinspection ExpiredTargetSdkVersion  sideloaded TV launcher, matches the TV's API level
        targetSdk 28
        versionCode 23
        versionName '3.12.2'
    }

    // Pinned debug key: the default ~/.android/debug.keystore lived outside the persisted
    // workspace and was lost in a VM restart, which changed the signature and made Android
    // refuse updates ("package conflicts with an existing package"). This copy is permanent.
    signingConfigs {
        debug {
            storeFile file('/home/hatch/workspace/tv-build-env/atvhome-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // Shrink build (user asked for a smaller APK, same features, same version):
    // R8 code shrinking + resource shrinking on the debug build. The launcher's
    // own code and the dadb entry points are kept in full (proguard-rules.pro),
    // so only unused library code/resources are removed.
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // ADB client: the phone remote presses keys through the TV's own network ADB (see KeyInjector)
    implementation 'dev.mobile:dadb:1.2.10'
}
